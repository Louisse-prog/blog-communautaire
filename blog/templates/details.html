{% extends "layouts/base.html" %}
{% block content %}
    {% if article %}
        <article>
            <h1>Détail de l'article</h1>
            <p>{{ article.title}}</p>
            <p>{{ article.content}}</p>

        </article>
    {% else %}
        <h2>Article introuvable</h2>
        <p>L'article que vous recherché n'existe pas.</p>
    {% endif %}

<a href="{% url 'blog:index' %}">Retour à l'accueil</a>
{% endblock content %}
